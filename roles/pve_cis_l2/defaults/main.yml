---
# Toggles par section CIS
pve_cis_filesystem: true
pve_cis_packages_services: true
pve_cis_network_sysctl: true
pve_cis_auditd: true
pve_cis_logging: true
pve_cis_auth_pam: true
pve_cis_sshd: true
pve_cis_pve_specific: true

# --- 1. Filesystem ---------------------------------------------------------
# Options CIS 1.1 : appliquées aux points de montage existants uniquement.
pve_cis_fstab_mounts:
  - { path: /tmp,           opts: [nodev, nosuid, noexec] }
  - { path: /var/tmp,       opts: [nodev, nosuid, noexec] }
  - { path: /var/log,       opts: [nodev, nosuid] }
  - { path: /var/log/audit, opts: [nodev, nosuid, noexec] }
  - { path: /home,          opts: [nodev, nosuid] }
  - { path: /dev/shm,       opts: [nodev, nosuid, noexec] }

pve_cis_suid_sgid_inventory: true
pve_cis_usb_storage_disabled: true        # L2 — attention si clés USB nécessaires
pve_cis_core_dumps_disabled: true

# --- 2. Packages & services ------------------------------------------------
pve_cis_services_absent:
  - avahi-daemon
  - cups
  - rpcbind
  - nfs-kernel-server
  - snmpd
  - telnetd
  - openbsd-inetd
  - tftpd-hpa
  - talkd
pve_cis_rsync_masked: true
pve_cis_packages_present:
  - rsyslog
  - auditd
  - fail2ban
  - libpam-pwquality
  - sudo
  - logrotate
  - aide
pve_cis_aide_init: true                   # aideinit (~plusieurs minutes)
pve_cis_unattended_upgrades: true

# --- 3. Network / sysctl ---------------------------------------------------
# ip_forward=0 sauf si le nœud fait du NAT/routage (mettre 1 dans ce cas).
pve_cis_sysctl:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  fs.suid_dumpable: 0
  kernel.randomize_va_space: 2

pve_cis_blacklist_modules:
  - dccp
  - sctp
  - rds
  - tipc

# --- 4. Auditd -------------------------------------------------------------
pve_cis_audit_backlog_limit: 8192
pve_cis_audit_immutable: false            # L2 strict : -e 2 (rend les rules immuables)
pve_cis_audit_max_log_file: 256
pve_cis_audit_max_log_file_action: keep_logs

# --- 5. Logging ------------------------------------------------------------
pve_cis_log_server: ""                    # ex: "@@192.168.1.100:514" (rsyslog distant)

# --- 6. Auth / PAM ---------------------------------------------------------
pve_cis_pwquality:
  minlen: 14
  minclass: 3
  dcredit: -1
  ucredit: -1
  lcredit: -1
  ocredit: -1
pve_cis_faillock:
  deny: 5
  unlock_time: 900
pve_cis_login_defs:
  PASS_MAX_DAYS: 365
  PASS_MIN_DAYS: 1
  PASS_WARN_AGE: 7
  INACTIVE: 30
  UMASK: "027"
pve_cis_sudo_logfile: /var/log/sudo.log
pve_cis_banner: |
  *** Acces reserve — systeme surveille. Toute activite est journalisee. ***

# --- 7. SSHD ---------------------------------------------------------------
pve_cis_sshd:
  PermitRootLogin: prohibit-password      # keep root via cle (PVE) — 'no' pour L2 strict
  PasswordAuthentication: "no"
  MaxAuthTries: 4
  MaxSessions: 10
  ClientAliveInterval: 300
  ClientAliveCountMax: 2
  AllowTcpForwarding: "no"
  AllowAgentForwarding: "no"
  X11Forwarding: "no"
  MaxStartups: 10:30:60
  LoginGraceTime: 60
  Banner: /etc/issue.net
  Ciphers: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
  KexAlgorithms: sntrup761x25519-sha512@openssh.com,curve25519-sha256,diffie-hellman-group16-sha512
  MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# --- 8. Spécifique PVE -----------------------------------------------------
pve_cis_pveproxy_listen_ip: ""            # ex: 192.168.1.50 (restreint l'UI web)
pve_cis_pve_2fa_totp: true                # ajoute tfa: totp au realm pam
pve_cis_pve_firewall_enable: true         # enable:1 dans /etc/pve/firewall/cluster.fw
pve_cis_fail2ban:
  bantime: 3600
  findtime: 600
  maxretry: 3
pve_cis_no_subscription_repo: true        # dépôt pve-no-subscription (lab)
pve_cis_disable_enterprise_repo: true
