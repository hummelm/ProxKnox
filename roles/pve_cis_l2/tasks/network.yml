---
- name: CIS 3 — Paramètres sysctl durcis
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/70-cis.conf
  loop: "{{ pve_cis_sysctl | dict2items }}"
  notify: Reload sysctl

- name: CIS 3.6 — Blacklist des modules réseau non utilisés
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cis-blacklist.conf
    content: |
      {% for m in pve_cis_blacklist_modules %}
      blacklist {{ m }}
      install {{ m }} /bin/true
      {% endfor %}
    mode: "0644"
  notify: Reload sysctl
