---
- name: CIS 4.1.1/4.1.2 — auditd installé et activé
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

- name: CIS 4.1.1 — /etc/audit/auditd.conf
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    mode: "0640"
    owner: root
    group: root
  notify: Restart auditd

- name: CIS 4.1.4 — Règles d'audit CIS
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/99-cis.rules
    mode: "0640"
  notify: Restart auditd

- name: "CIS 4.1.3/4.1.5 — GRUB : audit=1 et backlog limit"
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX)="(.*)"\s*$'
    line: >-
      GRUB_CMDLINE_LINUX="\2 audit=1 audit_backlog_limit={{ pve_cis_audit_backlog_limit }}"
    backrefs: true
    state: present
  register: _grub_cmdline
  notify: Update grub

- name: CIS 4.1.3 — GRUB sans audit=1 déjà présent en doublon
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: 'audit=1 audit=1'
    state: absent
  notify: Update grub
