---
- name: CIS 4.2.1/4.2.2 — journald persistent + compress
  ansible.builtin.template:
    src: journald-cis.conf.j2
    dest: /etc/systemd/journald.conf.d/60-cis.conf
    mode: "0644"
  notify:
    - Restart rsyslog

- name: CIS 4.2.1 — Créer /var/log/journal
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "2755"

- name: CIS 4.2.3/4.2.4 — rsyslog installé et actif
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started

- name: CIS 4.2.5 — Logs centralisés (si configuré)
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/90-cis-remote.conf
    content: "{{ pve_cis_log_server }}\n"
    mode: "0644"
  when: pve_cis_log_server | length > 0
  notify: Restart rsyslog

- name: CIS 4.2.5 — Pas de config de log distant résiduelle
  ansible.builtin.file:
    path: /etc/rsyslog.d/90-cis-remote.conf
    state: absent
  when: pve_cis_log_server | length == 0
  notify: Restart rsyslog

- name: CIS 4.2.6 — Permissions /var/log strictes
  ansible.builtin.file:
    path: /var/log
    state: directory
    mode: "0750"
