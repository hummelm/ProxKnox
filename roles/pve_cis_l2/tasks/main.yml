---
- name: CIS 1 — Filesystem & kernel modules
  ansible.builtin.include_tasks: filesystem.yml
  when: pve_cis_filesystem | bool
  tags: [filesystem, cis1]

- name: CIS 2 — Packages & services
  ansible.builtin.include_tasks: packages_services.yml
  when: pve_cis_packages_services | bool
  tags: [packages, cis2]

- name: CIS 3 — Network / sysctl
  ansible.builtin.include_tasks: network.yml
  when: pve_cis_network_sysctl | bool
  tags: [network, cis3]

- name: CIS 4.1 — Auditd
  ansible.builtin.include_tasks: auditd.yml
  when: pve_cis_auditd | bool
  tags: [auditd, cis4]

- name: CIS 4.2 — Logging
  ansible.builtin.include_tasks: logging.yml
  when: pve_cis_logging | bool
  tags: [logging, cis4]

- name: CIS 5 — Auth, PAM, SSHD
  ansible.builtin.include_tasks: auth_pam.yml
  when: pve_cis_auth_pam | bool
  tags: [auth, cis5]

- name: CIS 5.8 — SSHD
  ansible.builtin.include_tasks: sshd.yml
  when: pve_cis_sshd | bool
  tags: [sshd, cis5]

- name: CIS 7 — Spécifique Proxmox VE
  ansible.builtin.include_tasks: pve.yml
  when: pve_cis_pve_specific | bool
  tags: [pve, cis7]
