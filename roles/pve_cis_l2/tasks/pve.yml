---
- name: "CIS 7.2 — pveproxy : écoute restreinte (si configuré)"
  ansible.builtin.template:
    src: pveproxy-default.j2
    dest: /etc/default/pveproxy
    mode: "0644"
  when: pve_cis_pveproxy_listen_ip | length > 0
  notify: Restart pveproxy

- name: CIS 7.6 — Filtre fail2ban Proxmox
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/proxmox.conf
    content: |
      [Definition]
      failregex = pvedaemon\[.*authentication failure; rhost=<HOST> user=.* msg=.*
      journalmatch = _SYSTEMD_UNIT=pvedaemon.service
    mode: "0644"

- name: CIS 7.5/7.6 — Jail fail2ban (sshd + proxmox)
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: CIS 7.8 — Permissions /etc/pve
  ansible.builtin.file:
    path: /etc/pve
    mode: "0755"

- name: CIS 7.4 — 2FA TOTP sur le realm pam (L2)
  ansible.builtin.lineinfile:
    path: /etc/pve/domains.cfg
    regexp: '^\s*tfa:.*$'
    line: "\ttfa: totp"
    insertafter: '^pam:\s+pam\s*$'
    state: present
  when: pve_cis_pve_2fa_totp | bool

- name: CIS 7.7 — Activer le firewall PVE (datacenter)
  ansible.builtin.copy:
    dest: /etc/pve/firewall/cluster.fw
    content: |
      [OPTIONS]
      enable: 1

      [RULES]
    mode: "0644"
  when: pve_cis_pve_firewall_enable | bool

- name: CIS 7.10 — Dépôt pve-no-subscription (lab, deb822)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"
  when: pve_cis_no_subscription_repo | bool

- name: CIS 7.10 — Désactiver les dépôts enterprise (lab)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources
    - /etc/apt/sources.list.d/ceph.list
    - /etc/apt/sources.list.d/ceph.sources
  when: pve_cis_disable_enterprise_repo | bool
