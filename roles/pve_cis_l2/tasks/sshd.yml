---
- name: CIS 5.8 — Configuration SSHD durcie (drop-in)
  ansible.builtin.template:
    src: sshd-cis.conf.j2
    dest: /etc/ssh/sshd_config.d/60-cis-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: CIS 5.8 — Vérifier que le drop-in est inclus
  ansible.builtin.command: sshd -T -C user=root,host=localhost,addr=127.0.0.1
  changed_when: false
  register: _sshd_effective
  failed_when: >
    'passwordauthentication no' not in _sshd_effective.stdout | lower
