---
- name: CIS 5.3.1 — pwquality
  ansible.builtin.template:
    src: pwquality-cis.conf.j2
    dest: /etc/security/pwquality.conf.d/60-cis.conf
    mode: "0644"

- name: CIS 5.4.1 — faillock (deny / unlock_time)
  ansible.builtin.template:
    src: faillock-cis.conf.j2
    dest: /etc/security/faillock.conf
    mode: "0644"

- name: CIS 5.4.1 — Activer le profil PAM faillock
  ansible.builtin.command: pam-auth-update --enable faillock
  changed_when: true

- name: CIS 5.5 — Paramètres login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^\\s*{{ item.key }}\\s+.*$"
    line: "{{ item.key }}\t{{ item.value }}"
    state: present
  loop: "{{ pve_cis_login_defs | dict2items }}"
  notify: Remount CIS mountpoints

- name: CIS 5.1.2 — Permissions /etc/crontab
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: "0600"

- name: CIS 5.1.x — Permissions des répertoires cron
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.d

- name: CIS 5.1.8 — cron.allow / at.allow uniquement
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0640"
    state: touch
    modification_time: preserve
    access_time: preserve
  loop:
    - /etc/cron.allow
    - /etc/at.allow

- name: CIS 5.1.8 — Supprimer cron.deny / at.deny
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.deny
    - /etc/at.deny

- name: CIS 5.2.2 — Journalisation sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-cis-logging
    content: "Defaults logfile={{ pve_cis_sudo_logfile }}\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: CIS 5.8.10 — Banner /etc/issue.net
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ pve_cis_banner }}\n"
    mode: "0644"
  loop:
    - /etc/issue.net
    - /etc/issue
