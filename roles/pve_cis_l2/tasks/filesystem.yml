---
- name: CIS 1.1 — Durcir les options de montage existantes
  ansible.posix.mount:
    path: "{{ item.path }}"
    state: present
    fstype: "{{ ('tmpfs' if item.path == '/dev/shm' else 'auto') }}"
    opts: "{{ item.opts | join(',') }}"
  register: _mount_fstab
  loop: "{{ pve_cis_fstab_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: CIS 1.1 — Identifier les points de montage réellement présents
  ansible.builtin.set_fact:
    _cis_remounts: >-
      {{ pve_cis_fstab_mounts
         | selectattr('path', 'in', ansible_mounts | map(attribute='mount') | list)
         | list }}

- name: CIS 1.1 — Appliquer (remount) les options
  ansible.builtin.command: "mount -o remount {{ item.path }}"
  changed_when: true
  loop: "{{ _cis_remounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: CIS 1.1 — Répertoire d'inventaire CIS
  ansible.builtin.file:
    path: /usr/local/share/cis
    state: directory
    mode: "0750"
  when: pve_cis_suid_sgid_inventory | bool

- name: CIS 6.1.14 — Inventaire SUID/SGID de référence
  ansible.builtin.shell: |
    find / -xdev \( -perm -4000 -o -perm -2000 \) -type f \
      -printf '%m %u:%g %p\n' | sort > /usr/local/share/cis/suid-sgid-inventory.txt
  args:
    executable: /bin/bash
  changed_when: true
  when: pve_cis_suid_sgid_inventory | bool

- name: CIS 6.2.4 — Désactiver usb-storage (L2)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-usb-storage.conf
    content: |
      blacklist usb-storage
      install usb-storage /bin/true
    mode: "0644"
  when: pve_cis_usb_storage_disabled | bool

- name: CIS 6.2.1 — Core dumps désactivés
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-cis-coredump.conf
    content: |
      * hard core 0
      * soft core 0
    mode: "0644"
  when: pve_cis_core_dumps_disabled | bool
