---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart auditd
  ansible.builtin.command: service auditd restart
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: Restart pveproxy
  ansible.builtin.systemd:
    name: pveproxy
    state: restarted

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true
  register: _grub
  changed_when: _grub.rc == 0

- name: Remount CIS mountpoints
  ansible.builtin.command: "mount -o remount {{ item.path }}"
  changed_when: true
  loop: "{{ _cis_remounts | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Rebuild aide database
  ansible.builtin.command: aideinit -y -f
  changed_when: true
