---
- name: "Ansible Lockdown DEBIAN13-CIS — Level 2 server sur Proxmox VE 9.2"
  hosts: pve_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Vérifier que la cible est bien Proxmox VE 9.x
      ansible.builtin.command: pveversion
      changed_when: false
      register: _pve_version
      failed_when: "'9.' not in _pve_version.stdout"

    - name: Afficher la cible
      ansible.builtin.debug:
        msg: "Hardening CIS L2 (Lockdown) sur {{ inventory_hostname }} — {{ _pve_version.stdout }}"

  roles:
    - role: ansible-lockdown.DEBIAN13-CIS
      tags: [hardening, lockdown]

  post_tasks:
    - name: Résumé de l'audit syver (pré/post remédiation)
      ansible.builtin.debug:
        msg: "{{ audit_results | default('Audit non exécuté (run_audit: false)') }}"
      tags: [hardening, lockdown]
