---
# Ansible Lockdown DEBIAN13-CIS configuration — CIS Level 2 (server)
# Reference: https://github.com/ansible-lockdown/DEBIAN13-CIS (benchmark v1.0.0)

# CIS level
deb13cis_level_1: true
deb13cis_level_2: true

# High-impact controls enabled (lab — full L2)
deb13cis_disruption_high: true

# Proxmox VE is a hypervisor: IPv4 forwarding is required (PVE SDN/NAT/firewall).
# Exempts the 3.3.1.x ip_forward/forwarding controls.
deb13cis_is_router: true

# PVE DEVIATION — CIS 5.1.8 "DisableForwarding" does not apply to nodes of a
# Proxmox cluster: live migration (qm migrate --online) requires streamlocal
# SSH port-forwarding to /run/qemu-server/<vmid>.migrate.
# DisableForwarding=yes on a destination node breaks any incoming migration
# ("ram_save_setup failed: Input/output error"). The other SSH protections
# remain active (Port 2222, AllowUsers, ssh-audit, etc.).
# See docs/full-chain.md § 5 (CIS deviations).
deb13cis_rule_5_1_8: false

# IPv6 kept (PVE default)
deb13cis_ipv6_required: true

# Proxmox: rsync is a dependency of the proxmox-ve meta-package (the PVE apt
# hook blocks its removal). Lockdown alternative for 2.1.13: mask the rsync
# service instead of removing the package.
deb13cis_rsync_mask: true

# All sections
deb13cis_section1: true
deb13cis_section2: true
deb13cis_section3: true
# Section 4 (host ufw firewall) DELIBERATELY disabled on Proxmox: the PVE
# firewall (harden-pve.yml, HSE guide § 1.2.4) takes precedence — the HSE
# guide § 1.1.1 recommends skipping benchmark CIS § 4 in this case.
# ufw active + pve-firewall neutralize each other (observed SSH lockout).
deb13cis_section4: false
deb13cis_section5: true
deb13cis_section6: true
deb13cis_section7: true

# Reboot before the final audit (best results)
skip_reboot: false
change_requires_reboot: true

# ---------------- Automated audit (syver + DEBIAN13-CIS-Audit) --------------
setup_audit: true
run_audit: true
audit_only: false
audit_run_heavy_tests: true

# Audit content fetched (benchmark v1.0.0 branch) and syver binary download method
audit_content: git
get_audit_binary_method: download

# Reports pulled back to the controller
fetch_audit_output: true
audit_output_collection_method: fetch
audit_output_destination: "{{ playbook_dir }}/audit-summaries/"

# ---------------- PVE hardening (harden-pve.yml, HomeSecExplorer guide) ------
# "Enableable guides" system: each role/guide can be enabled individually
# (true/false). By default EVERYTHING IS ENABLED — including the PVE firewall
# and the ssh-audit profile (allow-list rules 8006/2222 + `sshd -T` validation
# before reload, tested on real runs). To disable a guide: flip its toggle to
# false.
# Source: https://github.com/HomeSecExplorer/Proxmox-Hardening-Guide
#          /blob/main/docs/pve9-hardening-guide.md (v0.9.2)
pve_hardening_microcode: true     # § 1.1.7/1.1.8 non-free-firmware + microcode
pve_hardening_autoupdate: true    # § 1.1.3 unattended-upgrades (security only)
pve_hardening_fail2ban: true      # § 2.3.3 sshd + Proxmox UI (8006)
pve_hardening_ksm: true           # § 1.2.6 KSM disabled (inter-VM side-channel)
pve_hardening_users: true        # § 2.1.x custom PVE accounts + RBAC
pve_hardening_logging: true       # § 5.1.2 auditd /etc/pve (+ export if host set)
pve_hardening_rkhunter: true     # § 5.3.2 daily rkhunter
pve_hardening_cluster: true       # § 3.x auto-noop when there is no cluster
pve_hardening_firewall: true      # § 1.2.4/1.2.5 PVE firewall (tested allow-list; console rollback on lockout)
pve_hardening_ssh_audit: true     # § 1.1.4 ssh-audit profile (`sshd -t` validated before reload)
pve_hardening_ceph: true          # § 3.3-3.5 Ceph hardening (auto-noop without Ceph) + E-NO/RH
pve_hardening_audit: true         # PVE audit → pve-hardening-audit_*.json JSON (like syver)

# Role contract (see roles/<role>/defaults/main.yml)
pve_fail2ban_sshd_port: 2222
pve_logging_remote_host: ""       # e.g. 192.168.122.1 → pve* syslog export
pve_users:
  - userid: adminlab@pam          # system account created by the lab preseed
    comment: "ProxKnox lab admin (HSE 2.1.1)"
    role: Administrator           # restrict in production (PVEAuditor/PVEAdmin)
    path: /
pve_users_require_2fa: false     # /!\ enroll users BEFORE
pve_firewall_mgmt_subnets:
  - 192.168.122.0/24             # controller (libvirt NAT)
  - 192.168.200.0/24             # PXE lab segment
pve_firewall_forward_drop: false # § 1.2.5 nftables tech preview
