---
# harden-pve.yml — Hardening of Proxmox VE 9 itself
# Source: HomeSecExplorer Proxmox VE 9 Hardening Guide v0.9.2
#   https://github.com/HomeSecExplorer/Proxmox-Hardening-Guide/blob/main/docs/pve9-hardening-guide.md
#
# Each role can be INDIVIDUALLY ENABLED via group_vars/pve_nodes.yml
# (pve_hardening_<role>: true|false). By default EVERYTHING IS ENABLED
# (guides applied automatically; can be disabled on demand). Compatible
# with site.yml (CIS Lockdown) — the rules are complementary:
# Lockdown covers the CIS Debian benchmark; these roles cover the
# PROXMOX controls (PVE firewall, pveum, fail2ban GUI, auditd /etc/pve,
# KSM, microcode).
#
# Usage:
#   ansible-playbook -i ansible/inventory/hosts.yml ansible/harden-pve.yml
#   ansible-playbook -i ansible/inventory/hosts.yml ansible/harden-pve.yml --tags fail2ban
- name: "Proxmox VE 9 hardening — HomeSecExplorer guide v0.9.2 (individually enableable roles)"
  hosts: pve_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify the target is actually Proxmox VE 9.x
      ansible.builtin.command: pveversion
      register: _pve_version
      changed_when: false
      failed_when: "'9.' not in _pve_version.stdout"

    - name: Target
      ansible.builtin.debug:
        msg: >
          PVE hardening (HomeSecExplorer) on {{ inventory_hostname }} —
          {{ _pve_version.stdout }}.
          Enabled: {{ ['microcode'] if pve_hardening_microcode else [] }}
          {{ ['autoupdate'] if pve_hardening_autoupdate else [] }}
          {{ ['fail2ban'] if pve_hardening_fail2ban else [] }}
          {{ ['ksm'] if pve_hardening_ksm else [] }}
          {{ ['users'] if pve_hardening_users else [] }}
          {{ ['logging'] if pve_hardening_logging else [] }}
          {{ ['rkhunter'] if pve_hardening_rkhunter else [] }}
          {{ ['cluster'] if pve_hardening_cluster else [] }}
          {{ ['firewall'] if pve_hardening_firewall else [] }}
          {{ ['ssh_audit'] if pve_hardening_ssh_audit else [] }}
          {{ ['ceph'] if pve_hardening_ceph else [] }}
          {{ ['audit'] if pve_hardening_audit else [] }}

  roles:
    # § 1.1.7/1.1.8 — non-free-firmware repositories + CPU microcode
    - role: pve_microcode
      when: pve_hardening_microcode | default(false)
      tags: [hardening, microcode]
    # § 1.1.3 — automatic security updates
    - role: pve_autoupdate
      when: pve_hardening_autoupdate | default(false)
      tags: [hardening, autoupdate]
    # § 2.3.3 — fail2ban for sshd + Proxmox UI
    - role: pve_fail2ban
      when: pve_hardening_fail2ban | default(false)
      tags: [hardening, fail2ban]
    # § 1.2.6 — KSM disabled (inter-VM side-channel)
    - role: pve_ksm
      when: pve_hardening_ksm | default(false)
      tags: [hardening, ksm]
    # § 2.1.x/2.2.x — custom accounts, RBAC, 2FA (opt.), API tokens
    - role: pve_users
      when: pve_hardening_users | default(false)
      tags: [hardening, users]
    # § 5.1.x — auditd /etc/pve + pve* syslog export (if configured)
    - role: pve_logging
      when: pve_hardening_logging | default(false)
      tags: [hardening, logging]
    # § 5.3.2 — daily rkhunter
    - role: pve_rkhunter
      when: pve_hardening_rkhunter | default(false)
      tags: [hardening, rkhunter]
    # § 3.x — corosync secauth / double ring (no-op outside a cluster)
    - role: pve_cluster
      when: pve_hardening_cluster | default(false)
      tags: [hardening, cluster]
    # § 1.2.4/1.2.5 — PVE firewall (allow-list 8006/2222, tested on real runs)
    - role: pve_firewall
      when: pve_hardening_firewall | default(false)
      tags: [hardening, firewall]
    # § 1.1.4 — strict ssh-audit profile (`sshd -t` validated before reload)
    - role: pve_ssh_audit
      when: pve_hardening_ssh_audit | default(false)
      tags: [hardening, ssh_audit]
    # § 3.3-3.5 — Ceph hardening (cephx, msgr2 secure, 0600 keyrings;
    # auto-noop if Ceph is not deployed) + E-NO / Red Hat Ceph 8 ecosystem
    - role: pve_ceph
      when: pve_hardening_ceph | default(false)
      tags: [hardening, ceph]
    # PVE hardening audit → JSON (same spirit as the syver CIS audit):
    # checks every control on the node, writes pve-hardening-audit_*.json
    # into audit-summaries/ (consolidated by tools/audit-report.py)
    - role: pve_audit
      when: pve_hardening_audit | default(false)
      tags: [audit, pve_audit]

  post_tasks:
    - name: Manual reminders (outside automatable scope)
      ansible.builtin.debug:
        msg:
          - "§ 1.1.4/2.1.4: UI 2FA and root break-glass: manual (UI) procedure."
          - "§ 2.3.1/2.3.2: UI certificates (pvenode cert / ACME): depends on the PKI."
          - "§ 1.1.1/1.1.2: CIS Debian benchmark → site.yml (Lockdown DEBIAN13-CIS role)."
          - "§ 3.1: corosync double ring: network topology to document."
          - "§ 4.x: 3-2-1 backups + tested restore: operations procedure."
