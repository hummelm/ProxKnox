---
- name: Install unattended-upgrades and apt-listchanges
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: 20auto-upgrades (§ 1.1.3)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  register: _auto_upgrade_cfg

- name: 50unattended-upgrades (origins, purge, reboot)
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  register: _unattended_cfg

- name: Enable the unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: No reported failure in the unattended-upgrades log
  ansible.builtin.command: grep -c 'ERROR' /var/log/unattended-upgrades/unattended-upgrades.log
  register: _uu_errors
  changed_when: false
  failed_when: false

- name: unattended-upgrades log — notice
  ansible.builtin.debug:
    msg: >
      Recommended monitoring: /var/log/unattended-upgrades/unattended-upgrades.log
      ({{ _uu_errors.stdout_lines[0] | default('0') }} historical ERROR line(s)).
