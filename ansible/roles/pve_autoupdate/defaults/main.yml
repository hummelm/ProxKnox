---
# pve_autoupdate — HSE PVE9 Hardening Guide § 1.1.3
# Automatic security updates (unattended-upgrades).

# Origins upgraded automatically (see § 1.1.3). Extend to add, e.g., the
# Proxmox repository in production.
pve_autoupdate_origins:
  - "origin=Debian,codename=${distro_codename},label=Debian;"
  - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security;"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security;"
pve_autoupdate_remove_unused: true
pve_autoupdate_automatic_reboot: false
# Notification address (leave empty to disable email)
pve_autoupdate_mail: ""
