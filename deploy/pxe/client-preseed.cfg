#### PXE CLIENT preseed (VM pxe-client, Debian 13 trixie, BIOS)
#### served by the PXE server: http://192.168.200.2/preseed/debian13-cis.cfg
#### (loaded automatically by pxelinux.cfg/default via preseed/url).
#### Debian is installed fully automatically with the CIS 1.1 compliant
#### partitioning (no EFI partition: BIOS boot).
#### The Proxmox VE 9.2 conversion is then driven by the PXE server
#### (PVE conversion via deploy/install-pve-on-debian.sh, 2 phases).
#### Placeholder __HOST_PUBKEY__ substituted by deploy/pxe_deploy_container.py.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i console-setup/ask_detect boolean false

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string __NODEHOSTNAME__
d-i netcfg/get_domain string pxe.lab

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris

d-i passwd/root-password password __ROOTPW__
d-i passwd/root-password-again password __ROOTPW__
d-i passwd/user-fullname string adminlab CIS Lab
d-i passwd/username string adminlab
d-i passwd/user-password password __ADMIN_PW__
d-i passwd/user-password-again password __ADMIN_PW__
d-i user-setup/allow-password-emptiness boolean false
d-i user-setup/encrypt-home boolean false

d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
tasksel tasksel/first multiselect standard, ssh-server
d-i popularity-contest/participate boolean false

#### CIS 1.1 compliant partitioning: /tmp /var/tmp /var/log /var/log/audit
#### /home /var/lib/vz as separate partitions (nodev/nosuid/noexec), BIOS boot (no EFI).
#### With --encrypt (deploy/pxe_deploy_container.py): the method below switches
#### from plain LVM to "crypto" (LUKS2 container -> LVM inside); the lines
#### prefixed ##ENCRYPT## are uncommented by the orchestrator and every
#### $lvmok{ } volume then lands inside the encrypted container
#### (/boot stays unencrypted). The passphrase placeholder __LUKSPW__ is
#### substituted like the others (LUKS_PW).
d-i partman-auto/method string lvm
##ENCRYPT##d-i partman-crypto/passphrase string __LUKSPW__
##ENCRYPT##d-i partman-crypto/passphrase-again string __LUKSPW__
##ENCRYPT##d-i partman-crypto/weak_passphrase boolean true
##ENCRYPT##d-i partman-crypto/confirm boolean true
##ENCRYPT##d-i partman-auto-crypto/erase_disks boolean false
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select cis_l2
d-i partman-auto/expert_recipe string \
    cis_l2 :: \
    1024 1024 1024 ext4 $primary{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
    15360 15360 15360 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
    2048 2048 2048 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /tmp } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    10240 10240 10240 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var } options/nodev{ nodev } options/nosuid{ nosuid } . \
    1024 1024 1024 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var/tmp } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    4096 4096 4096 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var/log } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    2048 2048 2048 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var/log/audit } options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } . \
    2048 2048 2048 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /home } options/nodev{ nodev } options/nosuid{ nosuid } . \
    2048 2048 2048 swap $lvmok{ } method{ swap } format{ } . \
    10240 20480 -1 ext4 $lvmok{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var/lib/vz } options/nodev{ nodev } options/nosuid{ nosuid } .

d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i cdrom-detect/eject boolean true

#### Access: root accepts the PXE server's deploy key (for the PVE conversion)
#### + the host key (administration); adminlab user + sudo NOPASSWD.
d-i preseed/late_command string \
    in-target mkdir -p /etc/ssh/sshd_config.d /root/.ssh /home/adminlab/.ssh /etc/sudoers.d ; \
    printf '%s\n' 'Port 2222' 'PermitRootLogin prohibit-password' > /target/etc/ssh/sshd_config.d/50-root.conf ; \
    in-target wget -q -O /root/.ssh/authorized_keys http://192.168.200.2/files/deploy_key.pub ; \
    printf '%s\n' '__HOST_PUBKEY__' >> /target/root/.ssh/authorized_keys ; \
    printf '%s\n' '__HOST_PUBKEY__' > /target/home/adminlab/.ssh/authorized_keys ; \
    in-target sh -c 'chown -R 1000:1000 /home/adminlab/.ssh && chmod 700 /root/.ssh /home/adminlab/.ssh && chmod 600 /root/.ssh/authorized_keys /home/adminlab/.ssh/authorized_keys' ; \
    printf '%s\n' 'adminlab ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-admin-lab ; \
    in-target chmod 440 /etc/sudoers.d/90-admin-lab
